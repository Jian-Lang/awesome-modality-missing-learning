<!DOCTYPE html>
<!--
  Source of imgs/cover_image.png, the cover figure of Awesome Modality Missing Learning.
  Everything is inline SVG.

  Each modality is one <g class="mod COLOUR"> group holding its label, icon, arrows, encoder
  and fusion token. Adding the class "missing" to a group greys that modality out, dashes
  its path and shows the red cross, so the right-hand panel is the left one with two groups
  marked missing. Colours are the CSS variables at the top of the style block.

  Re-export the PNG after editing (run from the repository root):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
        --hide-scrollbars --force-device-scale-factor=2 --window-size=1960,796 \
        --default-background-color=00000000 \
        --screenshot=imgs/cover_image.png imgs/cover_image.html

  The window size matches the SVG viewBox (1960 x 796), so the PNG is 3920 x 1592.
  The transparent default background leaves only the rounded white card, which keeps the
  figure from showing as a hard white rectangle on GitHub's dark theme.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Complete vs. missing modalities in multimodal learning</title>
<style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 100%; height: auto; }

  svg {
    --ink: #0f1b33;      /* headings and labels */
    --muted: #5b6b85;    /* captions */
    --navy: #2b3a5c;     /* fusion operator, output arrow, result */
    font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    fill: var(--ink);
  }
  /* per modality: c = line, d = dark (text, icon outline), k = mid tone, f = fill, t = tile tint */
  .blue   { --c: #2f6fe4; --d: #1d4fb8; --k: #7daeff; --f: #e1ecff; --t: #f0f5ff; }
  .green  { --c: #12a074; --d: #0b7556; --k: #62d1a8; --f: #d7f3e7; --t: #edfaf4; }
  .orange { --c: #ee7c1a; --d: #b4540b; --k: #ffb26b; --f: #ffe7cf; --t: #fff5ea; }
  .purple { --c: #8257e6; --d: #5a34bd; --k: #b9a0ff; --f: #ece3ff; --t: #f6f1ff; }
  .missing { --c: #aab4c3; --d: #8d98aa; --k: #d3d9e2; --f: #f0f2f6; --t: #f8f9fb; }

  .bg { fill: #fff; }
  .bar { fill: #eef2f8; }
  .bar-t { font-size: 34px; font-weight: 600; }
  .ok circle { fill: #16a673; }
  .no circle, .badge circle { fill: #e5484d; }
  .ok path, .no path, .badge path { fill: none; stroke: #fff; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; }
  .rule { stroke: #e1e6ef; stroke-width: 2; }

  .m { font-size: 36px; font-weight: 700; }
  .sub { font-size: 24px; }
  .tile { fill: var(--t); stroke: var(--k); stroke-width: 2; }
  .cap { font-size: 24px; font-weight: 500; text-anchor: middle; fill: var(--muted); }
  .wire { fill: none; stroke: var(--c); stroke-width: 3.2; }
  .head { fill: var(--c); stroke: var(--c); stroke-width: 1.4; stroke-linejoin: round; }
  .enc { fill: var(--f); stroke: var(--c); stroke-width: 2.6; }
  .enc-t { font-size: 25px; font-weight: 600; text-anchor: middle; fill: var(--d); }
  .link { fill: none; stroke: var(--c); stroke-width: 2; }
  .tok { fill: var(--k); stroke: var(--c); stroke-width: 2.6; }
  .badge { display: none; }
  .badge circle { stroke: #fff; stroke-width: 7; paint-order: stroke; }

  .missing .badge { display: inline; }
  .missing .m { fill: var(--d); }
  .missing .cap { fill: var(--d); }
  .missing .tile { stroke: var(--c); stroke-dasharray: 8 6; }
  .missing .wire { stroke-dasharray: 9 7; }
  .missing .enc { stroke-dasharray: 8 6; }
  .missing .link { stroke-dasharray: 4 5; }
  .missing .tok { fill: #fff; stroke-dasharray: 5 4; }

  .card { fill: #f7f9fc; stroke: #c6d0e1; stroke-width: 2; filter: url(#soft); }
  .card-t { font-size: 28px; font-weight: 700; fill: #26344f; }
  .fusion { fill: #e8edf9; stroke: #6f83b0; stroke-width: 2.6; }
  .oplus { fill: #fff; stroke: var(--navy); stroke-width: 2.6; }
  .oplus-x { fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; }
  .fus-t { font-size: 25px; font-weight: 600; text-anchor: middle; }
  .out { --c: var(--navy); }
  .result { fill: var(--navy); }
  .result-t { font-size: 27px; font-weight: 600; text-anchor: middle; fill: #fff; }
  .note { font-size: 22px; font-weight: 500; text-anchor: middle; fill: var(--muted); }

  /* icons take their colours from the modality group that uses them */
  .ic * { stroke: var(--d); stroke-width: 3.8; stroke-linejoin: round; stroke-linecap: round; }
  .ic .fc { fill: var(--c); }
  .ic .fk { fill: var(--k); }
  .ic .ff { fill: var(--f); }
  .ic .fw { fill: #fff; }
  .ic .fn { fill: none; }
  .ic .th { stroke-width: 3; }
  .ic path.th { fill: none; }
  .ic .cab-o { fill: none; stroke-width: 11; }
  .ic .cab-i { fill: none; stroke: var(--k); stroke-width: 4.5; }
  .ic .col-o { fill: none; stroke-width: 16; stroke-linecap: butt; }
  .ic .col-i { fill: none; stroke: var(--f); stroke-width: 9; stroke-linecap: butt; }
  .ic .pin-o { fill: none; stroke-width: 7; }
  .ic .pin-i { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: butt; }
</style>
</head>
